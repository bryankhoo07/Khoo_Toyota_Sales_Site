<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic setup -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- SEO -->
    <title>Toyota Setapak Khoo</title>
    <meta name="description" content="Toyota Setapak Khoo – new and used Toyota vehicles, servicing and enquiries.">
    <meta name="keywords" content="Setapak Toyota, Toyota Khoo, cars, dealership, servicing, Toyota vehicles, new cars, used cars, car sales, car service, automotive, car dealership, Toyota models, car maintenance, vehicle sales, car repair, Toyota service center, Setapak">
    <meta name="author" content="Toyota Khoo">

    <!-- Social sharing (Open Graph) -->
    <meta property="og:title" content="Toyota Khoo">
    <meta property="og:description" content="New and used Toyota vehicles, servicing and enquiries.">
    <meta property="og:type" content="website">

    <!-- Favicon (add favicon.ico to this folder) -->
    <link rel="icon" href="favicon.ico">

    <!-- Styles -->
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            line-height: 1.6;
            color: #222;
            background: #fff;
        }

        header, footer {
            background: #eb0a1e; /* Toyota red */
            color: #fff;
            padding: 1rem 1.5rem;
        }

        nav a {
            color: #fff;
            margin-right: 1rem;
            text-decoration: none;
        }

        nav a:hover { text-decoration: underline; }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        footer { text-align: center; font-size: 0.9rem; }
    </style>
</head>
<body>
    <header>
        <h1>Toyota Khoo</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#vehicles">Vehicles</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <section id="home">
            <h2>Welcome</h2>
            <p>Welcome to Setapak Toyota Khoo.</p>
        </section>

        <section id="vehicles">
            <h2>Vehicles</h2>
            <p>Our range of vehicles will be listed here.</p>
        </section>

        <section id="services">
            <h2>Services</h2>
            <p>Servicing and maintenance information goes here.</p>
        </section>

        <section id="contact">
            <h2>Contact</h2>
            <p>.</p>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Toyota Khoo. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>
</body>
</html>
